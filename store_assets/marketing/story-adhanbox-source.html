<meta charset="utf-8">
<title>AdhanBox — Story</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse 900px 700px at 50% 34%, rgba(201,162,39,.20), transparent 68%),
      linear-gradient(170deg, #0B5340 0%, #084232 45%, #052A20 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:#FAF6EF;
    position:relative;
  }

  /* Motif géométrique discret en fond */
  .pattern { position:absolute; inset:0; opacity:.055; }

  .wrap {
    position:relative; z-index:2;
    height:100%;
    /* zone sûre : l'UI Instagram mange ~250px en haut et en bas */
    padding:240px 80px 268px;
    display:flex; flex-direction:column; align-items:center;
  }

  /* ── En-tête ── */
  .brand { display:flex; align-items:center; gap:22px; }
  .brand img { width:82px; height:82px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .brand .name {
    font-family:"Hoefler Text","Palatino Linotype",Palatino,Georgia,serif;
    font-size:60px; font-weight:700; letter-spacing:.005em; line-height:1;
  }
  .brand .name span { color:#E8D9A8; }

  .kicker {
    margin-top:18px;
    font-size:23px; letter-spacing:.22em; text-transform:uppercase;
    color:#C9A227; font-weight:600; text-align:center;
  }

  /* ── Photo ── */
  .photo-frame {
    margin-top:46px;
    width:556px; height:556px;
    border-radius:34px;
    padding:12px;
    background:linear-gradient(150deg, rgba(232,217,168,.55), rgba(201,162,39,.18));
    box-shadow:0 40px 90px rgba(0,0,0,.55);
    flex:none;
  }
  .photo-frame img { width:100%; height:100%; object-fit:cover; border-radius:24px; display:block; }

  /* ── Accroche ── */
  h1 {
    margin-top:56px;
    font-family:"Hoefler Text","Palatino Linotype",Palatino,Georgia,serif;
    font-size:70px; line-height:1.12; font-weight:700;
    text-align:center; letter-spacing:-.01em;
  }
  h1 em { font-style:italic; color:#E8D9A8; }

  /* ── Points ── */
  .points {
    margin-top:40px;
    display:flex; flex-direction:column; gap:18px; align-items:center;
  }
  .points li { list-style:none; display:flex; align-items:center; gap:18px; font-size:34px; font-weight:500; }
  .points li::before { content:""; width:15px; height:15px; background:#C9A227; transform:rotate(45deg); flex:none; }

  /* ── Appel à l'action ── */
  .cta { margin-top:auto; padding-top:56px; display:flex; flex-direction:column; align-items:center; gap:22px; }
  .cta-pill {
    background:#C9A227; color:#052A20;
    font-size:42px; font-weight:800; letter-spacing:.005em;
    padding:26px 62px; border-radius:999px;
    box-shadow:0 18px 44px rgba(201,162,39,.4);
  }
  .cta-url {
    font-family:"Hoefler Text","Palatino Linotype",Palatino,Georgia,serif;
    font-size:46px; font-weight:700; color:#FAF6EF; letter-spacing:.01em;
  }
  .cta-note { font-size:26px; color:rgba(250,246,239,.72); }
</style>
