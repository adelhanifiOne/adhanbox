<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AdhanBox ADHBX-V3 — étiquette produit 55 × 32 mm</title>
<style>
  /* Page = exactement la taille de l'etiquette, sans marge : le PDF fait
     55 x 32 mm et rien d'autre. C'est ce qu'attend un imprimeur d'etiquettes. */
  @page { size: 55mm 32mm; margin: 0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:55mm; height:32mm; background:#fff; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
         -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  .label {
    width:55mm; height:32mm; box-sizing:border-box;
    /* Pas de trait de coupe : la forme est decoupee par l'imprimeur.
       Le padding tient lieu de zone de securite (2,4 / 3 mm). */
    padding:2.4mm 3mm;
    display:flex; flex-direction:column;
    font-size:5.4pt; line-height:1.3; color:#000;
    background:#fff;
  }
  .l-top { display:flex; justify-content:space-between; align-items:baseline; gap:2mm; }
  .brand { font-weight:800; font-size:8.2pt; line-height:1; letter-spacing:.01em; }
  .ident { text-align:right; font-size:5.4pt; line-height:1.28; white-space:nowrap; }
  .ident b { font-weight:700; }
  .addr { margin-top:1.5mm; font-size:5.4pt; line-height:1.34; }
  .elec { margin-top:.7mm; font-weight:700; font-size:5.5pt; }

  .l-bottom { margin-top:auto; display:flex; align-items:flex-end; gap:2.2mm; }
  .marks { display:flex; align-items:flex-end; gap:1.8mm; flex:0 0 auto; }
  /* CE aux proportions officielles, 5,4 mm (minimum legal 5 mm) */
  .ce { height:5.4mm; width:auto; display:block; }
  .weee { height:6.5mm; width:auto; display:block; }
  .batt { flex:1; font-size:5pt; line-height:1.24; font-weight:600; }
</style>
</head>
<body>
<div class="label">
    <div class="l-top">
      <div class="brand">AdhanBox</div>
      <div class="ident"><b>ADHBX-V3</b><br>S/N&nbsp;AB3-______</div>
    </div>

    <div class="addr">
      Adel Hanifi — AdhanBox<br>
      14 rue du Corps Franc Pommiès<br>
      65500 Vic-en-Bigorre, France — adhanbox.fr
    </div>

    <div class="elec">5&nbsp;V ⎓ 2&nbsp;A (USB-C) · Usage intérieur</div>

    <div class="l-bottom">
      <div class="marks">
        <svg class="ce" viewBox="0 0 68 50" fill="none" aria-label="Marquage CE">
          <path d="M25 3.5A21.5 21.5 0 0 0 25 46.5" stroke="#000" stroke-width="7" fill="none"/>
          <path d="M60 3.5A21.5 21.5 0 0 0 60 46.5" stroke="#000" stroke-width="7" fill="none"/>
          <rect x="46" y="21.5" width="21" height="7" fill="#000"/>
        </svg>
        <svg class="weee" viewBox="0 0 40 56" aria-label="Ne pas jeter avec les ordures ménagères">
          <g stroke="#000" stroke-width="2.6" fill="none" stroke-linecap="round">
            <path d="M8 16h24l-2.5 30H10.5z"/><path d="M5 12h30"/>
            <path d="M16 12V8h8v4"/><path d="M16 23v16M24 23v16"/>
          </g>
          <rect x="2" y="50" width="36" height="4" fill="#000"/>
        </svg>
      </div>
      <div class="batt">⚠ Pile bouton lithium CR1225 — tenir hors de portée des enfants</div>
    </div>
  </div>
</body>
</html>
